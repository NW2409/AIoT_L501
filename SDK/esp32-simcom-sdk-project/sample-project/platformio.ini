[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    # Add any required libraries here, for example:
    # https://github.com/your/library
    # Example: 
    # https://github.com/arduino-libraries/ArduinoJson.git

build_flags =
    -D SIMCOM_L501_DEBUG  # Enable debug mode for the SDK

monitor_speed = 115200

[platformio]
src_dir = src
lib_dir = ../sdk/src
include_dir = ../sdk/include